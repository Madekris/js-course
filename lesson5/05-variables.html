<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
      let variable1 = 3;
      console.log(variable1);

      const calculation = 2 + 2;
      console.log(calculation);
      console.log(calculation + 2);

      const result = calculation + 2;
      console.log(result);

      const massage = 'Hello';
      console.log(massage);

      variable1 = 5;
      console.log(variable1);

      variable1 = variable1 + 1;
      console.log(variable1);

      const variable2 = 3;
      var variable3 = 3;

      // "typeof" is used to check the type of the value
      console.log(typeof variable2);
      console.log(typeof massage);

    /*
    1. use "const" by default for making variables
    2. only use "let" if we have to change variables later on
    */
    </script>
  </body>
</html>
