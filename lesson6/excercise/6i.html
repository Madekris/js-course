<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <script>
      const randomNum = Math.random();
      const guess = 'heads';

      let result = '';
      if (randomNum < 0.5) {
        result = 'heads';
      } else {
        result = 'tails';
      }

      if (guess === result) {
        console.log('You Win!')
      } else {
        console.log('You Lose!')
      }
    </script>
  </body>
</html>
