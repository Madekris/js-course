<!DOCTYPE html>
<html lang="en">
  <head>
    <title>7c Excercise</title>
  </head>
  <body>
    <script>
      greet('Bikuren');
      greet('Segara Garage');
      greet('Simon');
      function greet (name) {
        if (name) {
          console.log(`Hello ${name}`);
        } else if (!name) {
          console.log('Hi there!');
        }
      }
    </script>
  </body>
</html>
