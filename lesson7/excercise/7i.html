<!DOCTYPE html>
  <head>
    <title>7h Excercise</title>
  </head>
  <body>
    <script>
      console.log(convertLenght(50, 'miles', 'km'));
      console.log(convertLenght(32, 'km', 'miles'));
      console.log(convertLenght(50, 'km', 'km'));
      console.log(convertLenght(5, 'miles', 'km'));
      console.log(convertLenght(5, 'miles', 'ft'));
      console.log(convertLenght(5, 'km', 'ft'));
      console.log(convertLenght(5, 'lbs', 'lbs'));

      function convertLenght (lenght, from, to) {

        let distance = '';

        if (from === 'miles' && to === 'km') {
          distance = lenght * 1.6 + ' km';
        } else if (from === 'km' && to === 'miles') {
          distance = lenght / 1.6 + ' miles';
        } else if (from === 'miles' && to === 'ft') {
          distance = lenght * 5280 + ' ft';
        } else if (from === 'km' && to === 'ft') {
          distance = lenght * 3281 + ' ft';
        } else if (from === 'miles' && to === 'miles' || from === 'km' && to === 'km') {
          distance = lenght + ` ${from || to}`;
        } else {
          return `Invalid unit: "${from || to}"`
        }
        return distance;
      }
    </script>
  </body>
</html>
