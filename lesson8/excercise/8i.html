<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <button onclick="
      playGame('heads');
    ">heads</button>
    
    <button onclick="
      playGame('tails');
    ">tails</button>
    <script>
      function playGame(guess) {
        const randomNum = Math.random();

        let result = '';
        if (randomNum < 0.5) {
          result = 'heads';
        } else {
          result = 'tails';
        }

        const guessResult = guess === result ? 'You Win!' : 'You Lose!'
        console.log(guessResult);
      }
      
    </script>
  </body>
</html>
