<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <button onclick="
      playGame('heads');
    ">heads</button>
    
    <button onclick="
      playGame('tails');
    ">tails</button>
    <script>
      const score = {
        wins: 0,
        losses: 0
      };
      function playGame(guess) {
        const randomNum = Math.random();

        let result = '';
        if (randomNum < 0.5) {
          result = 'heads';
        } else {
          result = 'tails';
        }

        const guessResult = guess === result ? 'You Win!' : 'You Lose!'
        // console.log(guessResult);

        if (guessResult === 'You Win!') {
          score.wins += 1;
          console.log(`You Win!
wins: ${score.wins}, losses: ${score.losses}`);
        } else if (guessResult === 'You Lose!') {
          score.losses += 1;
          console.log(`You Lose!
wins: ${score.wins}, losses: ${score.losses}`);
        }
      }
      
    </script>
  </body>
</html>
